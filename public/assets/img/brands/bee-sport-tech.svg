<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="sportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#sportBg)"/>
  <rect x="6" y="6" width="188" height="188" rx="34" fill="none" stroke="url(#sportGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Aerodynamic Dynamic Lightning Bolt / Tech Crest -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="38" fill="url(#sportGrad)" opacity="0.15"/>
    <!-- Tech Speed Bolt -->
    <path d="M 4 -32 L -18 2 L -2 2 L -8 32 L 20 -4 L 4 -4 Z" fill="url(#sportGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Aerodynamic Speed lines -->
    <line x1="-30" y1="-12" x2="-22" y2="-12" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
    <line x1="-34" y1="4" x2="-24" y2="4" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="-8" x2="32" y2="-8" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="12" x2="30" y2="12" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="100" y="152" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">BEE SPORT</text>
  <text x="100" y="168" font-family="'Montserrat', sans-serif" font-size="8" font-weight="600" fill="#fb7185" text-anchor="middle" letter-spacing="4">ACTIVE PERFORMANCE</text>
</svg>
