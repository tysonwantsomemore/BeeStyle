<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bgGrad1)"/>
  <rect x="6" y="6" width="188" height="188" rx="34" fill="none" stroke="url(#goldGrad1)" stroke-width="2" opacity="0.6"/>
  
  <!-- Diamond Atelier Emblem -->
  <g transform="translate(100, 85)">
    <!-- Outer Diamond -->
    <path d="M 0 -45 L 42 0 L 0 45 L -42 0 Z" fill="none" stroke="url(#goldGrad1)" stroke-width="3"/>
    <!-- Inner Diamond -->
    <path d="M 0 -32 L 30 0 L 0 32 L -30 0 Z" fill="url(#goldGrad1)" opacity="0.15"/>
    <path d="M 0 -32 L 30 0 L 0 32 L -30 0 Z" fill="none" stroke="#fef3c7" stroke-width="1.5"/>
    
    <!-- Monogram B & S -->
    <text x="0" y="8" font-family="'Montserrat', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">BS</text>
  </g>

  <!-- Brand Typography -->
  <text x="100" y="152" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#fef3c7" text-anchor="middle" letter-spacing="3">BEESTYLE</text>
  <text x="100" y="168" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="4">SIGNATURE</text>
</svg>
