<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="urbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="urbanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#urbanBg)"/>
  <rect x="6" y="6" width="188" height="188" rx="34" fill="none" stroke="url(#urbanGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Urban Hexagon Minimalist Monogram -->
  <g transform="translate(100, 80)">
    <!-- Hexagon Outer -->
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="url(#urbanGrad)" stroke-width="2.5"/>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="url(#urbanGrad)" opacity="0.15"/>
    
    <!-- Modernist U / B Icon -->
    <path d="M -16 -16 L -16 8 C -16 16 16 16 16 8 L 16 -16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="4" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="100" y="152" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">BEE URBAN</text>
  <text x="100" y="168" font-family="'Montserrat', sans-serif" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SMART CASUAL</text>
</svg>
