<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="luxuryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#luxuryBg)"/>
  <rect x="6" y="6" width="188" height="188" rx="34" fill="none" stroke="url(#luxuryGold)" stroke-width="2" opacity="0.6"/>
  
  <!-- Crown Crest -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="0" r="40" fill="url(#luxuryGold)" opacity="0.12"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#luxuryGold)" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Stylized Crown -->
    <path d="M -24 15 L -20 -15 L -8 2 L 0 -22 L 8 2 L 20 -15 L 24 15 Z" fill="url(#luxuryGold)" stroke="#fef9c3" stroke-width="1"/>
    <!-- Crown base jewels -->
    <circle cx="-16" cy="10" r="2" fill="#ffffff"/>
    <circle cx="0" cy="10" r="2.5" fill="#ffffff"/>
    <circle cx="16" cy="10" r="2" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="100" y="150" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="3">BEE LUXURY</text>
  <text x="100" y="168" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#a16207" text-anchor="middle" letter-spacing="5">HAUTE COUTURE</text>
</svg>
